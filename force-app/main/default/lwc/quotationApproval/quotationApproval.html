<template>
  <div class="slds-box slds-m-around_medium">
    <!-- Header -->
    <div class="slds-text-heading_medium slds-m-bottom_small">
      견적서 확인 및 승인
    </div>

    <!-- Loading -->
    <template if:true={loading}>
      <lightning-spinner alternative-text="로딩 중" size="medium"></lightning-spinner>
    </template>

    <!-- Error -->
    <template if:true={error}>
      <div class="slds-text-color_error slds-m-vertical_small">
        {error}
      </div>
    </template>

    <!-- Content -->
    <template if:true={opp}>
      <div class="slds-text-body_regular slds-m-bottom_small">
        <div><b>주문번호</b>: {opp.orderNumber}</div>
        <div><b>현재 상태</b>: {opp.stageName}</div>
      </div>

      <div class="slds-grid slds-wrap slds-gutters">
        <!-- LEFT : PDF 안내 영역 -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12">
          <div
            class="slds-box slds-theme_default slds-align_absolute-center"
            style="height:70vh; display:flex; flex-direction:column; justify-content:center;"
          >
            <lightning-icon
              icon-name="doctype:pdf"
              size="large"
            ></lightning-icon>

            <p class="slds-m-top_medium slds-text-align_center">
              보안 정책상 견적서는 페이지 안에서 직접 표시할 수 없습니다.<br />
              아래 버튼을 눌러 새 탭에서 확인해주세요.
            </p>

            <lightning-button
              variant="brand"
              label="견적서 새 탭으로 열기"
              onclick={openPdfInNewTab}
              class="slds-m-top_medium"
            ></lightning-button>
          </div>

          <!-- URL 표시 (디버그용, 필요 없으면 삭제 가능) -->
          <div class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
            URL: {resolvedPdfUrl}
          </div>
        </div>

        <!-- RIGHT : 승인/반려 -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12">
          <div class="slds-box slds-theme_default">
            <div class="slds-text-heading_small slds-m-bottom_small">
              승인 / 반려
            </div>

            <lightning-button
              variant="brand"
              label="승인"
              onclick={handleApprove}
              class="slds-m-right_small"
              disabled={actionDisabled}
            ></lightning-button>

            <lightning-button
              variant="destructive"
              label="반려"
              onclick={openRejectModal}
              disabled={actionDisabled}
            ></lightning-button>

            <div class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
              승인: StageName → “견적승인”<br />
              반려: LostReason__c 저장 + StageName → “Closed”
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Reject Modal -->
  <template if:true={showReject}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 class="slds-text-heading_medium">반려 사유 선택</h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
          <lightning-combobox
            label="취소사유"
            placeholder="취소사유를 선택해주세요"
            options={lostReasonOptions}
            value={rejectReason}
            onchange={handleRejectReasonChange}
          ></lightning-combobox>

          <template if:true={lostReasonLoading}>
            <div class="slds-m-top_small">
              <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
            </div>
          </template>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button
            label="취소"
            onclick={closeRejectModal}
            class="slds-m-right_small"
          ></lightning-button>
          <lightning-button
            variant="destructive"
            label="반려 확정"
            onclick={handleReject}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
