<template>
  <div class="main-container">
      <template if:true={opp}>
          <div class="slds-grid slds-wrap slds-gutters_medium">
              
              <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                  <div class="lavin-card">
                      <div class="section-title">견적서 확인</div>
                      <div class="iframe-wrapper">
                          <template if:true={googleDriveEmbedUrl}>
                              <iframe src={googleDriveEmbedUrl} width="100%" height="100%" style="border:0;" title="Quotation PDF"></iframe>
                          </template>
                          <template if:false={googleDriveEmbedUrl}>
                              <div class="slds-align_absolute-center" style="height:100%; color:#999;">링크가 없습니다.</div>
                          </template>
                      </div>
                  </div>
              </div>

              <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                  <div class="lavin-card">
                      <div class="section-title">주문 정보 및 승인</div>
                      
                      <div class="info-group">
                          <div class="info-row">
                              <span class="info-label">주문번호</span>
                              <span class="info-value">{opp.orderNumber}</span>
                          </div>
                          <div class="info-row">
                              <span class="info-label">현재 상태</span>
                              <span class="info-value">{opp.stageName}</span>
                          </div>
                      </div>

                      <div class="button-container-tight">
                          <div class="btn-wrapper">
                              <lightning-button 
                                  variant="brand" 
                                  label="승인" 
                                  stretch 
                                  class="big-btn btn-black"
                                  onclick={handleApprove}
                                  disabled={actionDisabled}>
                              </lightning-button>
                          </div>
                          <div class="btn-wrapper">
                              <lightning-button 
                                  variant="neutral" 
                                  label="반려" 
                                  stretch 
                                  class="big-btn btn-white"
                                  onclick={openRejectModal}
                                  disabled={actionDisabled}>
                              </lightning-button>
                          </div>
                      </div>
                      
                  </div>
              </div>
          </div>
      </template>
      
      <template if:true={showReject}>
          <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
              <div class="slds-modal__container">
                  <header class="slds-modal__header"><h2 class="slds-text-heading_medium">반려 사유 선택</h2></header>
                  <div class="slds-modal__content slds-p-around_medium">
                      <lightning-combobox label="취소사유" placeholder="사유 선택" options={lostReasonOptions} value={rejectReason} onchange={handleRejectReasonChange}></lightning-combobox>
                  </div>
                  <footer class="slds-modal__footer">
                      <lightning-button label="취소" onclick={closeRejectModal} class="slds-m-right_small"></lightning-button>
                      <lightning-button variant="destructive" label="반려 확정" onclick={handleReject}></lightning-button>
                  </footer>
              </div>
          </section>
          <div class="slds-backdrop slds-backdrop_open"></div>
      </template>
  </div>
</template>
