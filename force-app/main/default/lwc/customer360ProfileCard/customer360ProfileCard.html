<template>
  <lightning-card class="profile-card">
    <div class="card-background">
      <div class="profile-container">

        <!-- 상단: 사진 + 이름/고객번호 -->
        <div class="profile-header-section">
          <div class="profile-image-wrapper">
            <img src={avatarUrl} alt="프로필" class="profile-image">
          </div>

          <div class="profile-name-section">
            <h2 class="profile-name">{accountName}</h2>
            <p class="customer-number">{customerNumber}</p>
          </div>
        </div>

        <!-- 기본 정보 -->
        <div class="profile-details">
          <div class="detail-column">
            <div class="detail-item">
              <span class="detail-label">담당 매장</span>
              <span class="detail-value">{mainStore}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">주소</span>
              <span class="detail-value">{address}</span>
            </div>
          </div>

          <div class="detail-column">
            <div class="detail-item">
              <span class="detail-label">생일</span>
              <span class="detail-value">{birthdate}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">고객 상태</span>
              <span class="detail-value">{customerStatus}</span>
            </div>
          </div>
        </div>

        <!-- Customer 360 KPI -->
        <div class="section-divider"></div>

        <template if:true={hasC360}>
          <div class="kpi-grid">
            <div class="kpi-block">
              <div class="kpi-header">📦 구매</div>
              <div class="kpi-row">
                <span class="kpi-label">총 주문</span>
                <span class="kpi-value">{totalOrderCount}회</span>
              </div>
              <div class="kpi-row">
                <span class="kpi-label">총 구매금액</span>
                <span class="kpi-value">{totalPurchaseAmount}</span>
              </div>
              <div class="kpi-row">
                <span class="kpi-label">최근 구매일</span>
                <span class="kpi-value">{lastPurchaseDate}</span>
              </div>
            </div>
            <div class="section-divider"></div>
            <div class="kpi-block">
              <div class="kpi-header">📞 문의</div>
              <div class="kpi-row">
                <span class="kpi-label">진행중</span>
                <span class="kpi-value">{openCaseCount}건</span>
              </div>
              <div class="kpi-row">
                <span class="kpi-label">누적</span>
                <span class="kpi-value">{totalCaseCount}건</span>
              </div>
              <div class="kpi-row">
                <span class="kpi-label">최근 문의일</span>
                <span class="kpi-value">{lastCaseDate}</span>
              </div>
            </div>
            <div class="section-divider"></div>
            <div class="kpi-block">
              <div class="kpi-header">🔗 관계</div>
              <div class="kpi-row">
                <span class="kpi-label">최근 연락일</span>
                <span class="kpi-value">{lastInteractionDate}</span>
              </div>
              <div class="kpi-row">
                <span class="kpi-label">선호 채널</span>
                <span class="kpi-value">{preferredChannel}</span>
              </div>
            </div>
            <div class="section-divider"></div>
            <div class="kpi-block">
              <div class="kpi-header">⭐ 상태</div>
              <div class="kpi-row">
                <span class="kpi-label">등급</span>
                <span class="kpi-value">{customerTier}</span>
              </div>
              <div class="kpi-row">
                <span class="kpi-label">상태</span>
                <span class="kpi-value">{customerStatus}</span>
              </div>
            </div>
          </div>
        </template>

        <template if:false={hasC360}>
          <div class="empty-state">
            Customer 360 데이터가 없습니다. (Customer_360__c 레코드를 생성해주세요)
          </div>
        </template>

      </div>
    </div>
  </lightning-card>
</template>
