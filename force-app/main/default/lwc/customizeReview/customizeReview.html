<template>
    <div class="page-backdrop" aria-hidden="true"></div>

    <div class="cr-shell">
        <header class="cr-header">
            <div class="cr-header-left">
                <div>
                    <h2 class="cr-title">주문 확인</h2>
                    <p class="cr-subtitle">선택하신 내용과 픽업 매장을 확인하세요</p>
                </div>
            </div>
        </header>

        <div class="cr-layout">
            <!-- LEFT: Preview -->
            <section>
                <div class="preview-wrap">
                    <div class="preview-stage">
                        <template if:true={isLoadingImage}>
                            <div class="spinner-overlay">
                                <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
                            </div>
                        </template>

                        <div class="preview-canvas">
                            <template if:true={productImageUrl}>
                                <img src={productImageUrl} alt="제품 이미지" class="product-image" />
                            </template>

                            <template if:false={productImageUrl}>
                                <div class="preview-empty">제품 이미지가 준비되면 표시됩니다</div>
                            </template>

                            <template if:true={showInitials}>
                                <div class={initialsOverlayClass}>
                                    <span class="initials-text" style={initialsStyle}>
                                        {initialsPreview}
                                    </span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </section>

            <!-- RIGHT: Review + Store -->
            <section>
                <div class="panel">
                    <h3 class="panel-title">선택하신 내용</h3>

                    <div class="rows">
                        <div class="row">
                            <span class="row-label">카테고리</span>
                            <span class="row-value">{selectedFamily}</span>
                        </div>

                        <div class="row">
                            <span class="row-label">제품</span>
                            <span class="row-value">{productName}</span>
                        </div>

                        <div class="row">
                            <span class="row-label">이니셜 문구</span>
                            <span class="row-value">{initialsDisplay}</span>
                        </div>

                        <div class="row">
                            <span class="row-label">이니셜 색상</span>
                            <span class="row-value">
                                <span class="color-chip">
                                    <span class="color-dot" style={colorDotStyle}></span>
                                    <span>{colorLabel}</span>
                                </span>
                            </span>
                        </div>

                        <div class="row">
                            <span class="row-label">이니셜 위치</span>
                            <span class="row-value">{positionLabel}</span>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">픽업 매장 선택</h3>
                    <p class="hint">픽업 가능한 매장을 선택하세요.</p>

                    <template if:false={hasStoreSelected}>
                        <div class="action-card" onclick={openStoreModal}>
                            <div class="action-row">
                                <lightning-icon icon-name="standard:location" size="small"></lightning-icon>
                                <div class="action-text">
                                    <div class="action-title">매장 선택</div>
                                    <div class="action-sub">픽업 가능한 매장 선택</div>
                                </div>
                                <lightning-icon class="chev" icon-name="utility:chevronright" size="x-small"></lightning-icon>
                            </div>
                        </div>
                    </template>

                    <template if:true={hasStoreSelected}>
                        <div class="action-card selected" onclick={openStoreModal}>
                            <div class="action-row">
                                <lightning-icon icon-name="standard:location" size="small"></lightning-icon>
                                <div class="action-text">
                                    <div class="action-title">{storeName}</div>
                                    <div class="action-sub">
                                        <span class="store-status">
                                            <span class="status-dot"></span>
                                            매장 - 픽업 가능
                                        </span>
                                    </div>
                                </div>
                                <lightning-icon class="chev" icon-name="utility:chevronright" size="x-small"></lightning-icon>
                            </div>
                        </div>
                    </template>
                </div>
            </section>
        </div>

        <!-- Store Modal -->
        <template if:true={isStoreModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                onclick={closeStoreModal} title="Close">
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">매장 선택하기</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="store-list">
                            <template if:true={hasStores}>
                                <template for:each={storesVM} for:item="store">
                                    <div key={store.Id}
                                         class={store.cardClass}
                                         data-id={store.Id}
                                         onclick={handleStoreClick}>
                                        <div class="store-name">{store.Name}</div>
                                        <div class="store-addr">{store.Store_Address__c}</div>

                                        <div class="store-meta">
                                            <template if:true={store.canPickup}>
                                                <span class="store-status">
                                                    <span class="status-dot"></span>
                                                    매장 - 픽업 가능
                                                </span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </template>

                            <template if:false={hasStores}>
                                <div class="slds-text-align_center slds-p-around_large">
                                    <lightning-icon icon-name="utility:location" size="large"></lightning-icon>
                                    <p class="slds-m-top_small">등록된 매장이 없습니다</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- ===== Flow Footer 대체 (이전/다음·완료) ===== -->
        <div class="footerbar">
            <span class="hint">
                <template if:true={hasStoreSelected}>매장 선택 완료</template>
                <template if:false={hasStoreSelected}>다음으로 진행하려면 매장을 선택하세요</template>
            </span>

            <div class="footer-actions">
                <button class="btn" type="button" onclick={handleBack} disabled={disableBack}>이전</button>
                <button class="btn btn-primary" type="button" onclick={handleNextOrFinish} disabled={disableNextFinish}>
                    {nextFinishLabel}
                </button>
            </div>
        </div>
    </div>
</template>
