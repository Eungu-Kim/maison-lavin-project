<template>
  <lightning-card class="profile-card">
    <div class="card-background">
      <div class="profile-container">

        <div class="profile-header-section">
          <div class="profile-image-wrapper">
            <img src={avatarUrl} alt="프로필" class="profile-image" />
          </div>

          <div class="profile-name-section">
            <h2 class="profile-name">{accountName}</h2>
            <p class="customer-number">{appointmentNumber}</p>
          </div>
        </div>

        <div class="profile-details">
          <div class="detail-column">
            <div class="detail-item">
              <span class="detail-label">예약 상태</span>
              <span class="detail-value">{status}</span>
            </div>

            <div class="detail-item">
              <span class="detail-label">예약일</span>
              <span class="detail-value">{schedStart}</span>
            </div>
          </div>

          <div class="detail-column">
            <div class="detail-item">
              <span class="detail-label">제목</span>
              <span class="detail-value">{subject}</span>
            </div>

            <div class="detail-item">
              <span class="detail-label">상세 내용</span>
              <span class="detail-value">{description}</span>
            </div>

            <div class="detail-item">
              <span class="detail-label">Parent Record</span>
              <span class="detail-value">{parentRecordId}</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </lightning-card>
</template>
