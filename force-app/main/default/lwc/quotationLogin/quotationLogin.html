<template>
  <div class="login-container">
      
      <div class="lavin-login-card">
          <h2 class="login-title">MY MAISON LOGIN</h2>

          <div class="input-group">
              <lightning-input
                  class="input-field"
                  type="email"
                  label="이메일 (E-mail)"
                  placeholder="example@maisonlavin.com"
                  value={email}
                  onchange={handleEmailChange}
                  required
                  variant="standard">
              </lightning-input>

              <lightning-input
                  class="input-field"
                  type="password"
                  label="비밀번호 (Password)"
                  placeholder="비밀번호를 입력하세요"
                  value={password}
                  onchange={handlePasswordChange}
                  required
                  variant="standard">
              </lightning-input>
          </div>

          <template if:true={error}>
              <div class="slds-text-color_error slds-text-align_center slds-m-bottom_medium">
                  {error}
              </div>
          </template>

          <div class="btn-wrapper">
              <lightning-button
                  variant="brand"
                  label="로그인 후 견적서 확인"
                  title="로그인"
                  onclick={handleLogin}
                  class="btn-black-big"
                  stretch
                  disabled={loading}>
              </lightning-button>
          </div>

          <template if:true={loading}>
              <lightning-spinner alternative-text="로그인 중" size="medium"></lightning-spinner>
          </template>
      </div>

  </div>
</template>
