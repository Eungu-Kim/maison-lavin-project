<template>
    <lightning-card title="신규 예약 생성" icon-name="standard:service_appointment">
        <div class="slds-p-horizontal_small">
            <template if:true={isLoading}>
                <lightning-spinner size="small"></lightning-spinner>
            </template>

            <lightning-record-edit-form
                object-api-name="ServiceAppointment"
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}
                onerror={handleError}
            >
                <lightning-messages></lightning-messages>

                <!-- Parent Record (포함!) -->
                <lightning-input-field field-name="ParentRecordId" required></lightning-input-field>

                <!-- 예약 상태 -->
                <lightning-input-field field-name="Status" required></lightning-input-field>

                <!-- 서비스 시작 / 종료 -->
                <lightning-input-field field-name="SchedStartTime" required></lightning-input-field>
                <lightning-input-field field-name="SchedEndTime" required></lightning-input-field>

                <!-- 제목 -->
                <lightning-input-field field-name="Subject" required></lightning-input-field>

                <!-- 서비스 노트 -->
                <lightning-input-field field-name="Description"></lightning-input-field>

                <div class="slds-m-top_medium slds-text-align_right">
                    <lightning-button variant="brand" type="submit" label="예약 생성"></lightning-button>
                </div>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
